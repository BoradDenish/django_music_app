{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | MusicApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" href="{% static 'images/img.png' %}">
</head>
<body class="bg-black text-slate-100 min-h-screen flex items-center justify-center p-6 relative overflow-hidden font-sans">
    <div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-rose-600/15 rounded-full blur-[140px] pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-purple-600/15 rounded-full blur-[140px] pointer-events-none"></div>

    <div class="relative max-w-lg w-full text-center p-8 sm:p-12 glass border border-white/10 rounded-3xl shadow-2xl animate-fade-up">
        <div class="w-16 h-16 bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-2xl flex items-center justify-center shadow-lg mx-auto mb-6">
            <i class="fas fa-triangle-exclamation text-2xl"></i>
        </div>
        <span class="text-xs font-black uppercase tracking-widest text-rose-400 block mb-2">Error 500</span>
        <h1 class="text-4xl sm:text-5xl font-black text-white tracking-tight mb-3">Playback Interrupted</h1>
        <p class="text-slate-400 text-xs sm:text-sm mb-8 leading-relaxed">
            An unexpected error occurred while processing your request. Our audio engineers have been notified.
        </p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="{% url 'home' %}" class="btn-primary py-3 px-6 rounded-xl text-xs font-bold shadow-lg flex items-center justify-center gap-2">
                <i class="fas fa-rotate-right text-xs"></i> Back to Safety
            </a>
        </div>
    </div>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login - MusicApp</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Design System -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" href="{% static 'images/img.png' %}">
</head>
<body class="flex items-center justify-center min-h-screen relative overflow-hidden bg-black text-slate-100 p-4">

    <!-- Glowing Orbs -->
    <div class="absolute top-1/4 left-1/4 w-[450px] h-[450px] bg-purple-600/15 rounded-full blur-[140px] pointer-events-none animate-pulse-slow"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[450px] h-[450px] bg-pink-600/15 rounded-full blur-[140px] pointer-events-none animate-pulse-slow delay-2"></div>

    <div class="relative w-full max-w-md p-8 sm:p-10 glass border border-white/10 shadow-2xl animate-fade-up rounded-3xl z-10">
        
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-gradient-to-tr from-purple-600 to-pink-500 rounded-2xl flex items-center justify-center shadow-[0_0_20px_rgba(139,92,246,0.5)] mx-auto mb-4">
                <i class="fas fa-shield-halved text-white text-xl"></i>
            </div>
            <h2 class="text-3xl font-black tracking-tight text-white">Admin Console</h2>
            <p class="text-slate-400 text-xs font-medium mt-1">Staff & system administrator authentication</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-5 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-medium flex items-center gap-2">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'admin_login' %}" class="space-y-5">
            {% csrf_token %}
            
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-slate-300 uppercase tracking-wider ml-1">Admin Username or Email</label>
                <div class="relative group">
                    <i class="fas fa-user-shield absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-purple-400 transition-colors text-sm"></i>
                    <input type="text" name="email" class="w-full bg-white/5 border border-white/10 rounded-2xl pl-11 pr-4 py-3.5 focus:border-purple-500 focus:bg-white/10 outline-none transition text-xs md:text-sm text-white font-medium" placeholder="admin or admin@example.com" required>
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-bold text-slate-300 uppercase tracking-wider ml-1">Password</label>
                <div class="relative group">
                    <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-purple-400 transition-colors text-sm"></i>
                    <input type="password" name="password" class="w-full bg-white/5 border border-white/10 rounded-2xl pl-11 pr-4 py-3.5 focus:border-purple-500 focus:bg-white/10 outline-none transition text-xs md:text-sm text-white font-medium" placeholder="••••••••" required>
                </div>
            </div>
            
            <button type="submit" class="btn-primary w-full py-3.5 rounded-2xl text-xs md:text-sm font-bold mt-2 shadow-xl flex items-center justify-center gap-2">
                <i class="fas fa-sign-in-alt"></i> Access Admin Portal
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-white/5 text-center">
            <a href="{% url 'home' %}" class="text-xs font-bold text-slate-400 hover:text-white transition flex items-center justify-center gap-1.5">
                <i class="fas fa-arrow-left text-[10px]"></i> Return to Public Site
            </a>
        </div>
    </div>
</body>
</html>

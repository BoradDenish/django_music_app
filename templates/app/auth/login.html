{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MusicApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="flex items-center justify-center min-h-screen relative overflow-hidden bg-black">
    <!-- Animated background elements -->
    <div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[120px] animate-pulse"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-cyan-600/10 rounded-full blur-[120px] animate-pulse"></div>

    <div class="relative w-full max-w-md p-12 glass border border-white/10 shadow-2xl animate-fade-up mx-4">
        <div class="text-center mb-12">
            <div class="w-16 h-16 bg-gradient-to-tr from-purple-600 via-pink-500 to-orange-400 rounded-2xl flex items-center justify-center shadow-[0_0_30px_rgba(188,19,254,0.3)] mx-auto mb-8">
                <i class="fas fa-music text-white text-2xl"></i>
            </div>
            <h2 class="text-4xl font-black tracking-tighter">Welcome <span class="text-accent-neon-purple">Back</span></h2>
            <p class="text-gray-500 mt-3 font-medium">Log in to continue your journey.</p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div class="space-y-2">
                <label class="text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] ml-1">Email Address</label>
                <div class="relative group">
                    <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-600 group-focus-within:text-accent-neon-purple transition-colors"></i>
                    <input type="email" name="email" class="w-full bg-white/5 border border-white/5 rounded-2xl pl-12 pr-4 py-4 focus:border-purple-500/50 focus:bg-white/10 outline-none transition-all duration-300 placeholder-gray-700 text-sm" placeholder="name@example.com" required>
                </div>
            </div>
            <div class="space-y-2">
                <label class="text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] ml-1">Password</label>
                <div class="relative group">
                    <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-600 group-focus-within:text-accent-neon-purple transition-colors"></i>
                    <input type="password" name="password" class="w-full bg-white/5 border border-white/5 rounded-2xl pl-12 pr-4 py-4 focus:border-purple-500/50 focus:bg-white/10 outline-none transition-all duration-300 placeholder-gray-700 text-sm" placeholder="••••••••" required>
                </div>
            </div>
            
            <div class="flex items-center justify-between text-xs font-bold">
                <label class="flex items-center gap-2 cursor-pointer group">
                    <input type="checkbox" class="w-4 h-4 rounded border-white/10 bg-white/5 text-purple-600 focus:ring-purple-500/50 accent-purple-600">
                    <span class="text-gray-500 group-hover:text-gray-300 transition-colors">Remember me</span>
                </label>
                <a href="#" class="text-purple-400 hover:text-purple-300 transition-colors">Forgot password?</a>
            </div>

            <button type="submit" class="btn-primary w-full py-4 rounded-2xl text-lg mt-4">
                Sign In
            </button>
        </form>

        <p class="mt-10 text-center text-gray-500 text-sm font-medium">
            New to MusicApp? <a href="{% url 'signup' %}" class="text-white font-black hover:text-accent-neon-purple transition-colors ml-1">Create Account</a>
        </p>
    </div>
</body>
</html>

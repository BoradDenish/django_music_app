{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MusicApp{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" href="{% static 'app/images/favicon.ico' %}">
    <style>
        .search-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .search-glass:focus-within {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-neon-purple);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.2);
        }
    </style>
</head>
<body class="text-white min-h-screen bg-black overflow-x-hidden pb-24">
    
    <!-- Sidebar -->
    {% include 'app/layout/sidebar.html' %}

    <!-- Main Content Area -->
    <main class="md:ml-64 min-h-screen transition-all duration-300">
        <!-- Top Header -->
        <header class="sticky top-0 z-30 flex items-center justify-between px-6 py-4 glass-dark border-b border-white/5">
            <div class="flex items-center gap-4 flex-1 max-w-xl">
                <div class="search-glass flex items-center px-4 py-2 rounded-full w-full">
                    <i class="fas fa-search text-gray-500 mr-3"></i>
                    <input type="text" placeholder="Search for songs, artists, albums..." 
                           class="bg-transparent border-none outline-none text-sm w-full placeholder-gray-500">
                </div>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="hidden md:flex items-center gap-4">
                    <button class="text-gray-400 hover:text-white transition"><i class="fas fa-bell"></i></button>
                    <button class="text-gray-400 hover:text-white transition"><i class="fas fa-cog"></i></button>
                </div>
                <div class="h-10 w-10 rounded-full bg-gradient-to-tr from-purple-600 to-pink-500 border-2 border-white/10 flex items-center justify-center cursor-pointer hover:scale-105 transition">
                    <i class="fas fa-user text-sm"></i>
                </div>
            </div>
        </header>

        <div class="p-6 md:p-10">
            {% if messages %}
                {% for message in messages %}
                    <div class="mb-4 p-4 rounded-xl {% if message.tags == 'success' %}bg-green-500/20 border border-green-500/50 text-green-400{% else %}bg-red-500/20 border border-red-500/50 text-red-400{% endif %} animate-fade-in">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <!-- Global Player Bar -->
    <div id="global-player" class="player-bar px-6 flex items-center justify-between">
        <div class="flex items-center gap-4 w-1/3">
            <div class="w-14 h-14 rounded-lg bg-white/5 border border-white/10 overflow-hidden flex-shrink-0 shadow-lg">
                <img id="player-album-art" src="{% static 'artists/default.jpg' %}" alt="" class="w-full h-full object-cover">
            </div>
            <div class="truncate">
                <h4 id="player-song-title" class="font-bold text-sm truncate">Select a song</h4>
                <p id="player-artist-name" class="text-[11px] text-gray-500 truncate">Artist</p>
            </div>
            <button id="player-fav-btn" class="ml-2 text-gray-500 hover:text-pink-500 transition-colors"><i class="far fa-heart"></i></button>
        </div>

        <div class="flex flex-col items-center w-1/3">
            <div class="flex items-center gap-6 mb-2">
                <button class="text-gray-500 hover:text-white transition"><i class="fas fa-random text-xs"></i></button>
                <button class="text-gray-400 hover:text-white text-lg transition"><i class="fas fa-step-backward"></i></button>
                <button id="player-play-btn" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center hover:scale-110 active:scale-95 transition shadow-[0_0_20px_rgba(255,255,255,0.3)]">
                    <i class="fas fa-play ml-1"></i>
                </button>
                <button class="text-gray-400 hover:text-white text-lg transition"><i class="fas fa-step-forward"></i></button>
                <button class="text-gray-500 hover:text-white transition"><i class="fas fa-redo text-xs"></i></button>
            </div>
            <div class="flex items-center gap-3 w-full max-w-md">
                <span id="current-time" class="text-[10px] text-gray-500 w-8 text-right font-mono">0:00</span>
                <div id="progress-container" class="progress-bar flex-1 h-1.5 group overflow-hidden">
                    <div id="progress-filled" class="progress-filled h-full bg-gradient-to-r from-purple-500 to-cyan-400 rounded-full relative">
                        <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow-lg scale-0 group-hover:scale-100 transition-transform"></div>
                    </div>
                </div>
                <span id="total-duration" class="text-[10px] text-gray-500 w-8 font-mono">0:00</span>
            </div>
        </div>

        <div class="flex items-center justify-end gap-6 w-1/3">
            <div class="relative group">
                <button id="player-playlist-btn" class="text-gray-500 hover:text-white transition"><i class="fas fa-list-ul text-xs"></i></button>
                <div id="playlist-dropdown" class="absolute bottom-full right-0 mb-4 w-48 glass-dark rounded-xl p-2 hidden z-50 animate-fade-in">
                    <p class="text-[10px] font-bold uppercase tracking-widest text-gray-500 px-3 py-2">Add to Playlist</p>
                    <div id="playlist-items" class="max-h-48 overflow-y-auto"></div>
                </div>
            </div>
            <div class="flex items-center gap-3 group">
                <i class="fas fa-volume-up text-gray-500 group-hover:text-white text-xs"></i>
                <div id="volume-container" class="w-24 h-1 bg-white/10 rounded-full cursor-pointer relative overflow-hidden">
                    <div id="volume-filled" class="absolute inset-0 bg-white/40 rounded-full w-full"></div>
                </div>
            </div>
            <button id="expand-player" class="text-gray-500 hover:text-white transition"><i class="fas fa-expand text-xs"></i></button>
        </div>
    </div>

    <!-- Hidden Elements -->
    <audio id="main-audio-player"></audio>
    <div id="youtube-player-container" class="fixed bottom-24 right-6 w-64 aspect-video rounded-xl overflow-hidden shadow-2xl border border-white/10 hidden">
        <button id="close-yt-player" class="absolute top-2 right-2 w-8 h-8 bg-black/60 backdrop-blur-md rounded-full flex items-center justify-center text-white text-xs z-20 hover:bg-white hover:text-black transition">
            <i class="fas fa-times"></i>
        </button>
        <div id="yt-player"></div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let ytPlayer;
        let isYTReady = false;
        let currentMode = 'audio';
        let currentSongId = null;

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: '',
                playerVars: {
                    'autoplay': 0,
                    'controls': 1,
                    'modestbranding': 1,
                    'rel': 0
                },
                events: {
                    'onReady': () => { 
                        isYTReady = true; 
                    },
                    'onStateChange': onYTStateChange
                }
            });
        }

        function onYTStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                updateYTProgress();
            } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
                playBtn.innerHTML = '<i class="fas fa-play ml-1"></i>';
            }
        }

        function updateYTProgress() {
            if (currentMode === 'youtube' && isYTReady && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
                const currentTime = ytPlayer.getCurrentTime();
                const duration = ytPlayer.getDuration();
                const percent = (currentTime / duration) * 100;
                progressFilled.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(currentTime);
                durationEl.textContent = formatTime(duration);
                setTimeout(updateYTProgress, 1000);
            }
        }

        const audio = document.getElementById('main-audio-player');
        const playBtn = document.getElementById('player-play-btn');
        const progressFilled = document.getElementById('progress-filled');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('total-duration');
        const ytContainer = document.getElementById('youtube-player-container');
        const volumeContainer = document.getElementById('volume-container');
        const volumeFilled = document.getElementById('volume-filled');

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        playBtn.addEventListener('click', () => {
            if (currentMode === 'audio') {
                if (audio.src) {
                    if (audio.paused) {
                        audio.play();
                        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    } else {
                        audio.pause();
                        playBtn.innerHTML = '<i class="fas fa-play ml-1"></i>';
                    }
                }
            } else if (currentMode === 'youtube' && isYTReady) {
                const state = ytPlayer.getPlayerState();
                if (state === YT.PlayerState.PLAYING) {
                    ytPlayer.pauseVideo();
                    playBtn.innerHTML = '<i class="fas fa-play ml-1"></i>';
                } else {
                    ytPlayer.playVideo();
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                }
            }
        });

        // Seek Functionality
        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            if (currentMode === 'audio') {
                audio.currentTime = percent * audio.duration;
            } else if (currentMode === 'youtube' && isYTReady) {
                ytPlayer.seekTo(percent * ytPlayer.getDuration());
            }
        });

        // Volume Functionality
        volumeContainer.addEventListener('click', (e) => {
            const rect = volumeContainer.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            volumeFilled.style.width = `${percent * 100}%`;
            audio.volume = percent;
            if (isYTReady) ytPlayer.setVolume(percent * 100);
        });

        audio.addEventListener('timeupdate', () => {
            if (currentMode === 'audio') {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFilled.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            if (currentMode === 'audio') {
                durationEl.textContent = formatTime(audio.duration);
            }
        });

        window.playSong = function(url, title, artist, art, youtubeId = null, songId = null) {
            audio.pause();
            if (isYTReady) ytPlayer.stopVideo();
            
            currentSongId = songId;
            document.getElementById('player-song-title').textContent = title;
            document.getElementById('player-artist-name').textContent = artist;
            document.getElementById('player-album-art').src = art;

            if (youtubeId) {
                currentMode = 'youtube';
                ytContainer.classList.remove('hidden');
                if (isYTReady) {
                    ytPlayer.loadVideoById(youtubeId);
                    ytPlayer.playVideo();
                }
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                currentMode = 'audio';
                ytContainer.classList.add('hidden');
                audio.src = url;
                audio.play();
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }
        };

        document.getElementById('close-yt-player').addEventListener('click', () => {
            ytContainer.classList.add('hidden');
            if (isYTReady) ytPlayer.pauseVideo();
            playBtn.innerHTML = '<i class="fas fa-play ml-1"></i>';
        });

        document.getElementById('expand-player').addEventListener('click', () => {
            if (currentMode === 'youtube') {
                ytContainer.classList.toggle('w-64');
                ytContainer.classList.toggle('w-full');
                ytContainer.classList.toggle('max-w-4xl');
                ytContainer.classList.toggle('right-6');
                ytContainer.classList.toggle('left-1/2');
                ytContainer.classList.toggle('-translate-x-1/2');
                ytContainer.classList.toggle('bottom-24');
                ytContainer.classList.toggle('top-1/2');
                ytContainer.classList.toggle('-translate-y-1/2');
                ytContainer.classList.toggle('z-50');
            }
        });

        // Favorite Functionality
        const favBtn = document.getElementById('player-fav-btn');
        favBtn.addEventListener('click', () => {
            if (!currentSongId) return;
            const formData = new FormData();
            formData.append('song_id', currentSongId);
            formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

            fetch('{% url "toggle_favorite" %}', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'added') {
                    favBtn.innerHTML = '<i class="fas fa-heart text-pink-500 animate-bounce"></i>';
                } else {
                    favBtn.innerHTML = '<i class="far fa-heart"></i>';
                }
            });
        });

        // Playlist Functionality
        const playlistBtn = document.getElementById('player-playlist-btn');
        const playlistDropdown = document.getElementById('playlist-dropdown');
        const playlistItems = document.getElementById('playlist-items');

        playlistBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (playlistDropdown.classList.contains('hidden')) {
                fetch('{% url "get_playlists" %}')
                .then(res => res.json())
                .then(data => {
                    playlistItems.innerHTML = '';
                    data.playlists.forEach(p => {
                        const item = document.createElement('div');
                        item.className = 'px-3 py-2 hover:bg-white/10 cursor-pointer text-xs transition rounded-lg truncate';
                        item.textContent = p.name;
                        item.onclick = () => addToPlaylist(p.id);
                        playlistItems.appendChild(item);
                    });
                    playlistDropdown.classList.remove('hidden');
                });
            } else {
                playlistDropdown.classList.add('hidden');
            }
        });

        function addToPlaylist(playlistId) {
            if (!currentSongId) return;
            const formData = new FormData();
            formData.append('song_id', currentSongId);
            formData.append('playlist_id', playlistId);
            formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

            fetch('{% url "add_to_playlist" %}', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    playlistDropdown.classList.add('hidden');
                    alert('Added to playlist!');
                }
            });
        }

        document.addEventListener('click', () => playlistDropdown.classList.add('hidden'));
    </script>

    <!-- Footer Script (Mobile Sidebar Toggle) -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleSidebar');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                sidebar.classList.toggle('-translate-x-full');
            });
        }
    </script>
</body>
</html>
